<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>경쟁사 분석</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI','Malgun Gothic',sans-serif;background:#F8FAFB;color:#1A1A1A;
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:36px 32px;width:100%;max-width:380px;
box-shadow:0 4px 24px rgba(0,0,0,.06)}
.brand{font-size:18px;font-weight:800;letter-spacing:-.5px}
.brand span{color:#8B95A1;font-weight:500;font-size:14px;margin-left:6px}
.sub{color:#4B5563;font-size:13px;margin:6px 0 24px}
label{display:block;font-size:12px;font-weight:600;color:#4B5563;margin-bottom:6px}
input{width:100%;padding:11px 13px;border:1px solid #E5E7EB;border-radius:5px;font-size:15px;font-family:inherit;outline:none}
input:focus{border-color:#1B7E3E}
button{width:100%;margin-top:16px;padding:12px;background:#1B7E3E;color:#fff;border:none;border-radius:5px;
font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
button:hover{background:#0F5A29}button:disabled{opacity:.6;cursor:wait}
.err{color:#C62828;font-size:13px;margin-top:12px;min-height:18px;font-weight:500}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid #F1F3F5;font-size:11px;color:#8B95A1;line-height:1.6}
</style></head><body>
<div class="card">
  <div class="brand">경쟁사 분석 <span>유통 7사</span></div>

  <label for="pw">비밀번호</label>
  <input type="password" id="pw" autocomplete="off" placeholder="••••••••" autofocus>
  <button id="btn">열람하기</button>
  <div class="err" id="err"></div>

</div>

function b64(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function hexb(h){const u=new Uint8Array(h.length/2);for(let i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u}
async function dk(pw,salt,it){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:it,hash:"SHA-256"},k,256))}
async function ks(key,n){const out=new Uint8Array(n);let off=0,c=0;
while(off<n){const buf=new Uint8Array(key.length+8);buf.set(key,0);const dv=new DataView(buf.buffer);
dv.setUint32(key.length,Math.floor(c/4294967296));dv.setUint32(key.length+4,c>>>0);
const h=new Uint8Array(await crypto.subtle.digest("SHA-256",buf));
for(let i=0;i<h.length&&off<n;i++,off++)out[off]=h[i];c++}return out}
async function dec(pw){const salt=hexb(ENC.salt),ct=b64(ENC.ct),tag=b64(ENC.tag);
const key=await dk(pw,salt,ENC.iter);
const hk=await crypto.subtle.importKey("raw",key,{name:"HMAC",hash:"SHA-256"},false,["verify"]);
if(!await crypto.subtle.verify("HMAC",hk,tag,ct))return null;
const s=await ks(key,ct.length),pt=new Uint8Array(ct.length);
for(let i=0;i<ct.length;i++)pt[i]=ct[i]^s[i];
return new TextDecoder("utf-8").decode(pt)}
function render(h){document.open();document.write(h);document.close()}
const btn=document.getElementById("btn"),pw=document.getElementById("pw"),err=document.getElementById("err");
async function attempt(p,saved){try{const h=await dec(p);
if(h){sessionStorage.setItem(SS,p);render(h);return true}
if(!saved){err.textContent="비밀번호가 올바르지 않습니다.";pw.value="";pw.focus()}return false}
catch(e){err.textContent="오류: "+e.message;return false}}
async function submit(){if(!pw.value){err.textContent="비밀번호를 입력하세요.";return}
btn.disabled=true;btn.textContent="확인 중…";err.textContent="";
if(!await attempt(pw.value,false)){btn.disabled=false;btn.textContent="열람하기"}}
btn.addEventListener("click",submit);
pw.addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
(async()=>{const s=sessionStorage.getItem(SS);if(s){if(!await attempt(s,true))sessionStorage.removeItem(SS)}})();
